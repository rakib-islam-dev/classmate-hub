<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Cosmo School - SSC 2027 ClassMate Hub</title>
    <meta name="description" content="Exclusive academic collaboration platform, notes exchange marketplace, encrypted study vault, and video/audio peer rooms for Quantum Cosmo School SSC 2027 Batch students." />
    <meta property="og:title" content="Quantum Cosmo School - SSC 2027 ClassMate Hub" />
    <meta property="og:description" content="Exclusive academic collaboration platform, notes exchange marketplace, encrypted study vault, and video/audio peer rooms for Quantum Cosmo School SSC 2027 Batch students." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        var mode = localStorage.getItem('classmate_theme_mode') || 'dark';
        if (mode === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.setAttribute('data-theme', mode);
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
